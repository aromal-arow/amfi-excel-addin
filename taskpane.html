<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AMFI Mutual Fund Tools</title>

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- Custom functions run in this SAME shared runtime -->
    <script src="functions.js"></script>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            padding: 20px;
        }

        #status {
            margin-top: 15px;
            padding: 12px;
            background: #f3f3f3;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h2>AMFI Mutual Fund Tools</h2>

    <p>Shared Runtime Test</p>

    <div id="status">
        Starting...
    </div>

    <script>
        Office.onReady(function(info) {

            if (info.host === Office.HostType.Excel) {
                document.getElementById("status").innerHTML =
                    "✓ Shared runtime connected to Excel";
            } else {
                document.getElementById("status").innerHTML =
                    "Open this page inside Excel";
            }

        });
    </script>

</body>
</html>
